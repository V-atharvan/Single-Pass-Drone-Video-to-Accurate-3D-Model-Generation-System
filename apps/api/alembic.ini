# Alembic configuration for Single-Pass 3D Reconstruction API
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts
script_location = alembic

# Database URL — override with DATABASE_URL env var in production.
# Uses synchronous psycopg2 driver for Alembic (asyncpg is not supported by Alembic directly).
sqlalchemy.url = postgresql+psycopg2://single_pass_3d:devpassword@localhost:5432/single_pass_3d_dev

[post_write_hooks]
# hooks to run on newly generated revision files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
