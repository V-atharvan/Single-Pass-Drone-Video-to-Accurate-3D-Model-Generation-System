[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "single-pass-3d-api"
version = "0.1.0"
description = "FastAPI Control Plane API for Single-Pass 3D Reconstruction Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "redis>=5.0.4",
    "boto3>=1.34.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "psycopg2-binary>=2.9.9",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "aiobotocore>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
